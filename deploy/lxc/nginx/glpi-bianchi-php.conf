# Trechos comuns aos servidores :80 e :443 do GLPI Bianchi (instalado em
# /etc/nginx/snippets/ pelo install.sh).

location ~ ^/index\.php(/|$) {
    fastcgi_pass bianchi_fpm;
    fastcgi_keep_conn on;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    # Auditoria 2026-11: o painel web nunca roda com debug (página de erro com código-fonte e profiler
    # com cookies/segredos), nem com o CT em --env=dev. $_SERVER vence o .env.local; a CLI não é afetada.
    fastcgi_param APP_DEBUG 0;
    fastcgi_read_timeout 300s;
    internal;
}

# Métricas do FPM (Zabbix template "PHP-FPM by HTTP") — somente local
location ~ ^/(fpm-status|fpm-ping)$ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    fastcgi_pass bianchi_fpm;
    include fastcgi_params;
    fastcgi_param SCRIPT_NAME $uri;
    fastcgi_param SCRIPT_FILENAME $uri;
}

location = /nginx-status {
    stub_status;
    allow 127.0.0.1;
    allow ::1;
    deny all;
}

location ~ \.php$ {
    return 404;
}
