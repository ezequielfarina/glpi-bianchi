# vhost do GLPI Bianchi. Instalado em /etc/nginx/sites-available/ pelo install.sh
# (@APP_DIR@ substituído). TLS: ver docs/deploy/proxmox-ct.md (certbot ou proxy reverso).

upstream bianchi_fpm {
    server unix:/run/php/bianchi.sock;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root @APP_DIR@/public;

    # Inventários de equipamentos de rede chegam a dezenas de MB
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    access_log /var/log/nginx/glpi-bianchi.access.log;
    error_log  /var/log/nginx/glpi-bianchi.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Caminho legado do GLPI: agentes já configurados com .../front/inventory.php
    location = /front/inventory.php {
        rewrite ^ /index.php last;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass bianchi_fpm;
        fastcgi_keep_conn on;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300s;
        internal;
    }

    # Métricas do FPM (Zabbix template "PHP-FPM by HTTP") — somente local
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        fastcgi_pass bianchi_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param SCRIPT_FILENAME $uri;
    }

    location = /nginx-status {
        stub_status;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
