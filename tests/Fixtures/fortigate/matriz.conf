#config-version=FG100F-7.2.8-FW-build1639-240206:opmode=0:vdom=0:user=admin
#conf_file_ver=2349023744
#buildno=1639
#global_vdom=1
config system global
    set admin-sport 8443
    set hostname "FGT-MATRIZ"
    set timezone 18
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2xUxgAAAAAAAAAAAADMINHASHDONOTSTORE=
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 200.150.10.2 255.255.255.248
        set allowaccess ping https
        set type physical
        set role wan
    next
    edit "wan2"
        set vdom "root"
        set mode dhcp
        set type physical
        set role wan
    next
    edit "VPN-CVL"
        set vdom "root"
        set ip 169.254.10.1 255.255.255.255
        set type tunnel
        set remote-ip 169.254.10.2 255.255.255.252
        set interface "wan1"
    next
end
config firewall address
    edit "REDE-MATRIZ-DADOS"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "REDE-MATRIZ-SERVIDORES"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "REDE-CVL"
        set subnet 192.168.30.0 255.255.255.0
    next
    edit "BANCO-REDE"
        set subnet 172.31.200.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "GRP-MATRIZ"
        set member "REDE-MATRIZ-DADOS" "REDE-MATRIZ-SERVIDORES"
    next
end
config vpn certificate local
    edit "FGT-MATRIZ-CERT"
        set password ENC abcdefCERTPASS
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
MIIFHDBOBgkqhkiG9w0BBQ0wQTApBgkqhkiG9w0BBQwwHAQI
-----END ENCRYPTED PRIVATE KEY-----"
    next
end
config vpn ipsec phase1-interface
    edit "VPN-CVL"
        set interface "wan1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14 19
        set remote-gw 187.45.60.10
        set psksecret ENC kQ0jCVLSECRETDONOTSTORE==
        set dpd on-idle
        set comments "Túnel Matriz <-> Cascavel"
    next
    edit "VPN-BANCO"
        set interface "wan1"
        set ike-version 1
        set mode main
        set peertype any
        set proposal aes256-sha1
        set dhgrp 5
        set keylife 28800
        set remote-gw 198.51.100.7
        set psksecret ENC BANCOSECRETDONOTSTORE
        set nattraversal disable
    next
    edit "FORTICLIENT"
        set type dynamic
        set interface "wan1"
        set ike-version 2
        set peertype any
        set net-device disable
        set mode-cfg enable
        set ipv4-start-ip 10.212.134.200
        set ipv4-end-ip 10.212.134.210
        set proposal aes256-sha256
        set dhgrp 14
        set eap enable
        set psksecret ENC FORTICLIENTSECRET
    next
end
config vpn ipsec phase2-interface
    edit "VPN-CVL-P2"
        set phase1name "VPN-CVL"
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set auto-negotiate enable
        set src-addr-type name
        set dst-addr-type name
        set src-name "GRP-MATRIZ"
        set dst-name "REDE-CVL"
    next
    edit "VPN-BANCO-P2"
        set phase1name "VPN-BANCO"
        set proposal aes256-sha1
        set pfs disable
        set keylifeseconds 3600
        set src-subnet 192.168.20.10 255.255.255.255
        set dst-subnet 172.31.200.0 255.255.255.0
    next
    edit "FORTICLIENT-P2"
        set phase1name "FORTICLIENT"
        set proposal aes256-sha256
    next
end
config router static
    edit 1
        set gateway 200.150.10.1
        set device "wan1"
    next
    edit 2
        set dst 192.168.30.0 255.255.255.0
        set device "VPN-CVL"
    next
    edit 3
        set dst 192.168.31.0 255.255.255.0
        set device "VPN-CVL"
    next
    edit 4
        set dst 192.168.30.0 255.255.255.0
        set blackhole enable
        set distance 254
    next
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
        edit "VPN-OVERLAY"
        next
    end
    config members
        edit 1
            set interface "wan1"
        next
        edit 3
            set interface "VPN-CVL"
            set zone "VPN-OVERLAY"
        next
    end
end
