# vhost do GLPI Bianchi. Instalado em /etc/nginx/sites-available/ pelo install.sh
# (@APP_DIR@ e @TLS_DIR@ substituídos). Ver docs/deploy/proxmox-ct.md (seção HTTPS).
#
#   :80  → só o GLPI Agent (POST /, /front/inventory.php, /inventory) e métricas locais;
#          todo o resto (painel, API) é redirecionado para HTTPS.
#   :443 → painel, API e também o agente (agentes novos podem usar https://).

upstream bianchi_fpm {
    server unix:/run/php/bianchi.sock;
    keepalive 8;
}

# ------------------------------------------------------------------ HTTP (agente)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root @APP_DIR@/public;
    server_tokens off;

    client_max_body_size 64m;
    client_body_buffer_size 1m;
    access_log /var/log/nginx/glpi-bianchi.access.log;
    error_log  /var/log/nginx/glpi-bianchi.error.log warn;

    # Raiz: o GLPI Agent faz POST aqui; navegador (GET) vai para o painel em HTTPS
    location = / {
        if ($request_method = GET) {
            return 301 https://$host/app/;
        }
        try_files /nonexistent /index.php$is_args$args;
    }
    location = /front/inventory.php { rewrite ^ /index.php last; }
    location ~ ^/[Ii]nventory$ { try_files /nonexistent /index.php$is_args$args; }

    include snippets/glpi-bianchi-php.conf;

    # Painel e API só por HTTPS (senha e cookie de sessão nunca trafegam em claro)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------ HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    root @APP_DIR@/public;
    server_tokens off;

    # Certificado: auto-assinado gerado pelo install.sh, ou o da sua CA interna
    # (substitua os arquivos e `systemctl reload nginx`).
    ssl_certificate     @TLS_DIR@/cert.pem;
    ssl_certificate_key @TLS_DIR@/key.pem;
    # Mozilla "intermediate" (2025): só TLS 1.2/1.3, cifras AEAD com PFS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BianchiTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 64m;
    client_body_buffer_size 1m;
    access_log /var/log/nginx/glpi-bianchi.access.log;
    error_log  /var/log/nginx/glpi-bianchi.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
    # HSTS: habilite SÓ com certificado confiável (CA interna/pública) e acesso por nome.
    # Com certificado auto-assinado o navegador deixaria de permitir "continuar mesmo assim".
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        if ($request_method = GET) {
            return 302 /app/;
        }
        try_files /nonexistent /index.php$is_args$args;
    }
    location = /front/inventory.php { rewrite ^ /index.php last; }

    # Interface web (Vue 3, build estático versionado em frontend/dist — ADR-0007)
    location = /app {
        return 301 /app/;
    }
    location ^~ /app/_static/ {
        # arquivos com hash do build (vite build.assetsDir) — sem fallback: chunk ausente é 404 real.
        # Não confundir com a rota SPA /app/assets/:uuid, que cai no bloco /app/ abaixo.
        alias @APP_DIR@/frontend/dist/_static/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location ^~ /app/ {
        alias @APP_DIR@/frontend/dist/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
        # CSP: só scripts do próprio servidor (sem inline); mapa/CEP liberados explicitamente
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://viacep.com.br https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    include snippets/glpi-bianchi-php.conf;
}
