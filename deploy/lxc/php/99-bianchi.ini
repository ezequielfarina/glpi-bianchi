; Instalado em /etc/php/8.4/{fpm,cli}/conf.d/ pelo install.sh
;
; Um switch de 52 portas pode gerar inventário de ~20 MB e consumir centenas de MB
; no parse (comportamento observado no GLPI upstream) — daí os limites generosos.
memory_limit = 1024M
max_execution_time = 300
post_max_size = 64M
upload_max_filesize = 64M

expose_php = Off
date.timezone = America/Sao_Paulo
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

apc.enable_cli = 1
