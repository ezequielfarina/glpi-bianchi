doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            ltree: App\Shared\Doctrine\Type\LtreeType
        mapping_types:
            ltree: ltree
        # Tabelas fora do ORM (transporte "failed" do Messenger) ficam fora do schema diff
        schema_filter: ~^(?!(messenger_messages|asset_inventory_seq)$)~
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Um mapeamento por módulo (bounded context). Novo módulo = nova entrada aqui.
        mappings:
            Organization:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organization/Entity'
                prefix: 'App\Organization\Entity'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Entity'
                prefix: 'App\Identity\Entity'
            Asset:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Asset/Entity'
                prefix: 'App\Asset\Entity'
            Software:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Software/Entity'
                prefix: 'App\Software\Entity'
            Network:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Network/Entity'
                prefix: 'App\Network\Entity'
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Entity'
                prefix: 'App\Inventory\Entity'
            Attachment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Attachment/Entity'
                prefix: 'App\Attachment\Entity'
            Supplier:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Supplier/Entity'
                prefix: 'App\Supplier\Entity'
            Contract:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Contract/Entity'
                prefix: 'App\Contract\Entity'
            License:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/License/Entity'
                prefix: 'App\License\Entity'
            Settings:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Settings/Entity'
                prefix: 'App\Settings\Entity'
            Tools:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Tools/Entity'
                prefix: 'App\Tools\Entity'
            Stock:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Stock/Entity'
                prefix: 'App\Stock\Entity'
            Audit:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Audit/Entity'
                prefix: 'App\Audit\Entity'
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
