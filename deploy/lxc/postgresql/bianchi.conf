# Tuning base para CT com 4 GB RAM / SSD (ajuste pela RAM real do CT).
# Instalado em /etc/postgresql/17/main/conf.d/bianchi.conf pelo install.sh.

listen_addresses = 'localhost'
max_connections = 100

# Memória (~25% RAM para shared_buffers, ~75% para effective_cache_size)
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# SSD / thin provisioning do Proxmox
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL / checkpoints: ingestão de inventário é write-heavy em rajadas
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# JSONB grande (payload bruto): TOAST com lz4
default_toast_compression = lz4

# Observabilidade (Zabbix / pg_stat_statements na fase 2)
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
track_io_timing = on
