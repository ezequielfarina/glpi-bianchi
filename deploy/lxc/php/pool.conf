; Pool FPM dedicado. Instalado em /etc/php/8.4/fpm/pool.d/bianchi.conf
; (@APP_DIR@ e @APP_USER@ substituídos pelo install.sh)

[bianchi]
user = @APP_USER@
group = @APP_USER@

listen = /run/php/bianchi.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Rajadas de agentes (ex.: todos às 08:00). A requisição é curta: valida, grava
; o payload bruto e enfileira — o processamento pesado fica nos workers.
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

pm.status_path = /fpm-status
ping.path = /fpm-ping

request_terminate_timeout = 300s
slowlog = /var/log/php8.4-fpm-bianchi-slow.log
request_slowlog_timeout = 10s

chdir = @APP_DIR@
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Auditoria 2026-11: o painel web nunca roda em modo debug (página de erro com código-fonte,
; profiler com cookies e segredos), nem quando o CT foi instalado com --env=dev para rodar testes.
; Reforço do fastcgi_param APP_DEBUG 0 do nginx (é este que o Symfony lê, via $_SERVER).
env[APP_DEBUG] = 0

